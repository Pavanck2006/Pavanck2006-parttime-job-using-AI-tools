server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: parttimejob-platform
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:h2}

  # Default datasource is MySQL, with flexible fallback or environment overrides
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:parttimejob_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:root}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:root}}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  sql:
    init:
      mode: never

# JWT Configuration
jwt:
  # Base64-encoded 256-bit secret key for HMAC-SHA256
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expiration-ms: 86400000 # 24 hours

# Application Specific Configurations
app:
  name: PartTime Job
  tagline: "Find Work. Earn More. Work Safely."
  cors:
    allowed-origins: "*"
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS,PATCH
    allowed-headers: "*"

logging:
  level:
    root: INFO
    com.parttimejob: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
